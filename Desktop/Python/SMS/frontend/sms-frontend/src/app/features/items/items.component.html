<div class="page-container">
  <div class="card">
    <div class="header-row">
      <h2>Item Master</h2>
      <button class="btn btn-primary" (click)="newItem()">+ New Item</button>
    </div>

    <input class="search" type="text" placeholder="Search by description, code or brand..."
           [(ngModel)]="searchTerm" (ngModelChange)="load()" />

    <table class="grid">
      <thead>
        <tr>
          <th></th><th>Code</th><th>Description</th><th>Unit</th><th>Cost</th><th>Sales Price</th><th>Brand</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let i of items">
          <td>
            <img *ngIf="i.itemPhoto" class="thumb" [src]="i.itemPhoto" alt="" />
            <div *ngIf="!i.itemPhoto" class="thumb placeholder">N/A</div>
          </td>
          <td>{{ i.code }}</td>
          <td>{{ i.description }}</td>
          <td>{{ i.unit }}</td>
          <td>{{ i.cost | number:'1.2-2' }}</td>
          <td>{{ i.salesPrice | number:'1.2-2' }}</td>
          <td>{{ i.brand }}</td>
          <td class="actions">
            <button class="btn btn-secondary" (click)="edit(i)">Edit</button>
            <button class="btn btn-danger" (click)="remove(i)">Delete</button>
          </td>
        </tr>
        <tr *ngIf="items.length === 0">
          <td colspan="8" class="empty">No items found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="overlay" *ngIf="showForm" (click)="cancel()"></div>
<div class="drawer" *ngIf="showForm">
  <h3>{{ editingId ? 'Edit Item' : 'New Item' }}</h3>
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="form-row photo-row">
      <label>Photo</label>
      <img *ngIf="photoPreview" class="preview" [src]="photoPreview" alt="preview" />
      <input type="file" accept="image/*" (change)="onPhotoSelected($event)" />
    </div>
    <div class="form-row">
      <label>Code</label>
      <input type="text" formControlName="code" />
    </div>
    <div class="form-row">
      <label>Description</label>
      <input type="text" formControlName="description" />
    </div>
    <div class="form-row">
      <label>Unit</label>
      <select formControlName="unit">
        <option *ngFor="let u of units" [value]="u">{{ u }}</option>
      </select>
    </div>
    <div class="form-row">
      <label>Cost</label>
      <input type="number" step="0.01" formControlName="cost" />
    </div>
    <div class="form-row">
      <label>Sales Price</label>
      <input type="number" step="0.01" formControlName="salesPrice" />
    </div>
    <div class="form-row">
      <label>Brand</label>
      <input type="text" formControlName="brand" />
    </div>
    <div class="form-row">
      <label>Supplier</label>
      <input type="text" formControlName="supplier" />
    </div>

    <div class="drawer-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
    </div>
  </form>
</div>
